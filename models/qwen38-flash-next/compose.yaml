# RadixArk/Qwen3.8-Flash-Next-NVFP4 on the official SGLang image, built-in MTP (NEXTN) drafter.
#
# First start downloads the weights from Hugging Face at the measured revisions into
# $HF_HOME (default ~/.cache/huggingface); a gated model needs HF_TOKEN set. Then:
#   docker compose up -d && docker compose logs -f
#
# The launch every Qwen3.8-Flash-Next test in the video ran on except tool use (BFCL), which
# used the v0.5.20 file next to this one. Speed: 22.4 s to first token for a ~254K-token
# prompt in the full 262,144 window, measured 2026-09-12 at a 600 W GPU power cap.
#
# Pin the digest if you want the exact measured image:
#   lmsysorg/sglang@sha256:9d2a843c706c74bc259c0d9abf360551eb2734e1e7d255ab012a6965f10480b6
#
# Source: the SGLang cookbook's RTX PRO 6000 recipe for this checkpoint (low latency, PLE offload):
#   https://docs.sglang.io/cookbook/autoregressive/Qwen/Qwen3.8-Flash-Next#hw=rtx6000&variant=default&quant=nvfp4&strategy=low-latency&nodes=single&pleOffload=on
# Two values changed from the recipe, both on purpose:
#   --max-running-requests  16 -> 1   16 slots leave a 76,224-token KV pool, so 128K and the
#                                      full window cannot be served. One slot gives 268,096.
#   --max-mamba-cache-size  48 -> 5   NEXTN needs five mamba states per request on this
#                                      model. 3 boots, then deadlocks on the first request
#                                      (it shows up as a 600 s warmup timeout). 5 is the floor.
#
# IMAGE TESTS (CAPTCHA, Rube Goldberg): run with --mem-fraction-static 0.93 instead of 0.96.
# At 0.96 and 0.95 the image preprocessor hit CUDA OOM and the server answered 500.
#
# MEMORY. The 47.68 GiB per-layer embedding (PLE) table is pinned in host RAM. Container
# memory peaked at 86.0 GiB, exactly the cap below; host free RAM fell to 14 GB on a 91 GiB
# box. The cookbook asks for >= 64 GB free host RAM. Run nothing else large next to it.
name: best_sglang_official_qwen38_flash_next

services:
  flashnext-official:
    image: lmsysorg/sglang:dev-qwen38-next-local
    container_name: flashnext-official

    gpus: all
    ipc: host
    shm_size: 32gb

    # Hard cap with NO swap. The pinned PLE table plus runtime sits at this
    # ceiling; letting it swap would turn a clear OOM into a silent 100x
    # slowdown that looks like a hang.
    mem_limit: 86g
    memswap_limit: 86g

    ports:
      - "127.0.0.1:8000:8000"

    ulimits:
      # memlock=-1 is REQUIRED: the PLE table is pinned (mlock'd) host memory.
      # The cookbook says so; without it the pin fails and loading falls back
      # or dies.
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576

    environment:
      HF_HOME: /hf
      HF_TOKEN: ${HF_TOKEN:-}
      CUDA_VISIBLE_DEVICES: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK: "1"

    volumes:
      # Mount the cache ROOT, not just the snapshot: snapshot files are relative
      # symlinks into ../../blobs and would dangle if only the snapshot were
      # visible in-container.
      - type: bind
        source: ${HF_HOME:-${HOME}/.cache/huggingface}
        target: /hf
        read_only: false

    entrypoint: ["sglang"]
    command:
      - serve
      - --model-path
      - RadixArk/Qwen3.8-Flash-Next-NVFP4
      - --revision
      - 7b719225242aacd3dbd3f9407468c2ee9a9d2594
      - --served-model-name
      - Qwen3.8-Flash-Next
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tp
      - "1"
      - --quantization
      - modelopt_fp4
      - --fp4-gemm-backend
      - flashinfer_cutlass
      - --moe-runner-backend
      - flashinfer_cutlass
      - --page-size
      - "64"
      - --mamba-track-interval
      - "64"
      - --chunked-prefill-size
      - "4096"
      - --context-length
      - "262144"
      - --speculative-algorithm
      - NEXTN
      - --speculative-num-steps
      - "3"
      - --speculative-eagle-topk
      - "1"
      - --speculative-num-draft-tokens
      - "4"
      - --mamba-radix-cache-strategy
      - extra_buffer_lazy
      # ONE slot, FIVE mamba states. See the header for why both numbers.
      - --max-running-requests
      - "1"
      - --max-mamba-cache-size
      - "5"
      - --mamba-ssm-dtype
      - bfloat16
      - --mem-fraction-static
      - ${SGLANG_MEM_FRACTION_STATIC:-0.96}    # 0.93 for the image tests: SGLANG_MEM_FRACTION_STATIC=0.93 docker compose up -d
      - --cuda-graph-max-bs-decode
      - "1"
      # The PLE table in pinned host RAM. This is the line that costs the memory.
      - --ple-offload-embedding
      - --reasoning-parser
      - qwen3
      # The checkpoint's chat_template.jinja emits tool calls in the Qwen3-Coder
      # XML form (<tool_call><function=..><parameter=..>), so this is the parser
      # that turns them into OpenAI `tool_calls`. It only touches requests that
      # carry `tools`; plain chat and the NIAH/throughput numbers are unaffected.
      - --tool-call-parser
      - qwen3_coder
      - --enable-metrics

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      # Measured boot: load_weight 102 s + scheduler, healthy at ~2.5 min.
      # First boot on a cold JIT cache is longer.
      start_period: 3600s

    # An OOM or a startup error must stay stopped, never become a restart loop.
    restart: "no"
