# RadixArk/Qwen3.8-Flash-Next-NVFP4 on the RELEASED lmsysorg/sglang:v0.5.20 image.
#
# Used for the tool-use test (BFCL), so Flash-Next ran it on the same engine release as the
# two 27B models. It is qwen38-flash-next-nvfp4.sglang.yaml with two mechanical changes:
#   image   lmsysorg/sglang:dev-qwen38-next-local -> lmsysorg/sglang:v0.5.20
#   --tp    -> --tp-size   (0.5.20 renamed it; --tp dies on the argument parser)
# Everything else is identical; read that file's header for why each value is what it is.
# Not speed-measured on this image.
#
#   docker compose -f docker/qwen38-flash-next-nvfp4.sglang-v0520.yaml up -d
name: best_sglang_official_v0520_qwen38_flash_next

services:
  flashnext-official-v0520:
    image: lmsysorg/sglang:v0.5.20
    container_name: flashnext-official-v0520

    gpus: all
    ipc: host
    shm_size: 32gb

    # Hard cap with NO swap. The pinned PLE table plus runtime sits at this
    # ceiling; letting it swap would turn a clear OOM into a silent 100x
    # slowdown that looks like a hang.
    mem_limit: 86g
    memswap_limit: 86g

    ports:
      - "127.0.0.1:8000:8000"

    ulimits:
      # memlock=-1 is REQUIRED: the PLE table is pinned (mlock'd) host memory.
      # The cookbook says so; without it the pin fails and loading falls back
      # or dies.
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576

    environment:
      CUDA_VISIBLE_DEVICES: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK: "1"

    volumes:
      # Mount the cache ROOT, not just the snapshot: snapshot files are relative
      # symlinks into ../../blobs and would dangle if only the snapshot were
      # visible in-container.
      - type: bind
        source: ${HF_HOME:-${HOME}/.cache/huggingface}
        target: /hf
        read_only: true

    entrypoint: ["sglang"]
    command:
      - serve
      - --model-path
      - /hf/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4/snapshots/7b719225242aacd3dbd3f9407468c2ee9a9d2594
      - --served-model-name
      - Qwen3.8-Flash-Next
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tp-size
      - "1"
      - --quantization
      - modelopt_fp4
      - --fp4-gemm-backend
      - flashinfer_cutlass
      - --moe-runner-backend
      - flashinfer_cutlass
      - --page-size
      - "64"
      - --mamba-track-interval
      - "64"
      - --chunked-prefill-size
      - "4096"
      - --context-length
      - "262144"
      - --speculative-algorithm
      - NEXTN
      - --speculative-num-steps
      - "3"
      - --speculative-eagle-topk
      - "1"
      - --speculative-num-draft-tokens
      - "4"
      - --mamba-radix-cache-strategy
      - extra_buffer_lazy
      # ONE slot, FIVE mamba states. See the header for why both numbers.
      - --max-running-requests
      - "1"
      - --max-mamba-cache-size
      - "5"
      - --mamba-ssm-dtype
      - bfloat16
      - --mem-fraction-static
      - "0.96"
      - --cuda-graph-max-bs-decode
      - "1"
      # The PLE table in pinned host RAM. This is the line that costs the memory.
      - --ple-offload-embedding
      - --reasoning-parser
      - qwen3
      # The checkpoint's chat_template.jinja emits tool calls in the Qwen3-Coder
      # XML form (<tool_call><function=..><parameter=..>), so this is the parser
      # that turns them into OpenAI `tool_calls`. It only touches requests that
      # carry `tools`; plain chat and the NIAH/throughput numbers are unaffected.
      - --tool-call-parser
      - qwen3_coder
      - --enable-metrics

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      # Measured boot: load_weight 102 s + scheduler, healthy at ~2.5 min.
      # First boot on a cold JIT cache is longer.
      start_period: 300s

    # An OOM or a startup error must stay stopped, never become a restart loop.
    restart: "no"
