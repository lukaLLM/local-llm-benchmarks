# orcarouter/Qwen3.8-27B-Uncensored-NVFP4 on SGLang v0.5.20 with the DFlash2 drafter.
#
# The exact launch every orcarouter/Qwen3.8-27B-Uncensored-NVFP4 test in the video ran on,
# and its speed arm. Identical to qwen38-27b-nvfp4.sglang.yaml except the checkpoint, the
# served name and the quantization. No variables were overridden, so every
# ${VAR:-default} below ran at its default.
#
#   checkpoint  orcarouter/Qwen3.8-27B-Uncensored-NVFP4 @ 96d4d0b66d94314909d1af73f955e94bf68335ac (gated)
#   drafter     incoai/Qwen3.8-27B-DFlash2      @ 015e795645c74b1a0eeef3b570031fb62e769bc5 (BF16)
#   window      262,144 tokens, 4 slots, fp8 KV cache
#   quant       compressed-tensors (its own NVFP4 export), not modelopt_fp4
#
# Download both at those revisions first (see README). The compose runs offline and points
# at the snapshot folders by hash; if yours differ, edit the two paths below.
#
#   docker compose -f docker/qwen38-27b-uncensored-nvfp4.sglang.yaml up -d
name: sglang_qwen38_27b
services:
  sglang:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang:v0.5.20}
    pull_policy: missing
    container_name: sglang27b
    gpus: all
    ipc: host
    shm_size: 32gb
    mem_limit: ${ENGINE_MEM_LIMIT:-86g}
    memswap_limit: ${ENGINE_MEM_LIMIT:-86g}
    ports:
    - 127.0.0.1:${SGLANG_HOST_PORT:-8000}:8000
    ulimits:
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    volumes:
    - type: bind
      source: ${HF_HOME:-${HOME}/.cache/huggingface}
      target: /hf
      read_only: true
    command:
    - python3
    - -m
    - sglang.launch_server
    - --model-path
    - /hf/hub/models--orcarouter--Qwen3.8-27B-Uncensored-NVFP4/snapshots/96d4d0b66d94314909d1af73f955e94bf68335ac
    - --served-model-name
    - Qwen3.8-27B-Uncensored
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --tp-size
    - '1'
    - --quantization
    - compressed-tensors
    - --kv-cache-dtype
    - ${KV_CACHE_DTYPE:-fp8_e4m3}
    - --attention-backend
    - ${SGLANG_ATTENTION_BACKEND:-flashinfer}
    - --chunked-prefill-size
    - ${PREFILL_BUDGET:-2048}
    - --context-length
    - ${ENGINE_CTX:-262144}
    - --max-running-requests
    - ${MAX_RUNNING_REQUESTS:-4}
    - --max-mamba-cache-size
    - ${SGLANG_MAX_MAMBA_CACHE_SIZE:-20}
    - --mamba-radix-cache-strategy
    - ${SGLANG_MAMBA_RADIX_CACHE_STRATEGY:-extra_buffer}
    - --mamba-full-memory-ratio
    - '9.94'
    - --mamba-ssm-dtype
    - ${SGLANG_MAMBA_SSM_DTYPE:-float32}
    - --mem-fraction-static
    - ${SGLANG_MEM_FRACTION_STATIC:-0.85}
    - --disable-radix-cache
    - --reasoning-parser
    - qwen3
    - --tool-call-parser
    - qwen3_coder
    - --enable-metrics
    - --speculative-algorithm
    - DFLASH
    - --speculative-draft-model-path
    - /hf/hub/models--incoai--Qwen3.8-27B-DFlash2/snapshots/015e795645c74b1a0eeef3b570031fb62e769bc5
    - --speculative-num-draft-tokens
    - '8'
    - --speculative-draft-model-quantization
    - unquant
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8000/health
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 300s
    restart: 'no'
